spring:
  h2:
    console:
      enabled: false
  datasource:
    dynamic:
      primary: master
      strict: false
      datasource:
        master:
          driver-class-name: org.h2.Driver
          url: jdbc:h2:mem:test1;MODE=MYSQL;INIT=RUNSCRIPT FROM 'classpath:db/db.sql'
          username: sa
          password:
  redis:
    enable: false
servicePublicKeyPath: test_certs/test_pub_key.der
servicePrivateKeyPath: test_certs/test_pri_key.der