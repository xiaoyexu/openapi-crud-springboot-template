server:
  port: ${PORT:6666}
spring:
  jackson:
    default-property-inclusion: NON_NULL
  datasource:
    dynamic:
      primary: master
      strict: false
      datasource:
        master:
          #          driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
          driverClassName: com.mysql.cj.jdbc.Driver
          #          url: ${DB_URL:jdbc:postgresql://172.17.0.1:5432/postgres}
          url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_SCHEMA:dev}
          #          url: ${DB_HOST:jdbc:sqlserver://localhost:1433;database=master;trustServerCertificate=true;}
          username: ${DB_USERNAME:root}
          password: ${DB_PASSWORD:root}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mvc:
    servlet:
      path: ${WEB_BASE_PATH:/open-api/v1}
management:
  endpoints:
    web:
      base-path: /
      path-mapping:
        health: ping
      exposure:
        include: metrics,info,health
  info:
    git:
      mode: full
  prometheus:
    metrics:
      export:
        enabled: true
logging:
  level:
    root: ${ROOT_LOG_LEVEL:debug}
    com:
      xuxiaoye: ${LOG_LEVEL:debug}
openapi:
  ArchitectureDojo:
    base-path: /
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    enabled: true
    path: /swagger
    use-root-path: true
admin:
  accessToken:
    expiration: ${ACCESS_EXPIRE_SECONDS:1800}
  refreshToken:
    expiration: ${REFRESH_EXPIRE_SECONDS:7200}
servicePublicKeyPath: ${SERVICE_PUBLIC_KEY_PATH:}
servicePrivateKeyPath: ${SERVICE_PRIVATE_KEY_PATH:}
configs:
  scheduler:
    enabled: true
    check: ${CHECK:0 */1 * * * *}