swagger: "2.0"
info:
  title: OpenAPI definition
  version: v0
host: localhost:6001
basePath: /springboot-dev/hello-service/v1
schemes:
  - http
  - https
#securityDefinitions:
#  Bearer:
#    type: apiKey
#    name: Authorization
#    in: header
#security:
#  - Bearer: [ ]
produces:
  - application/json
consumes:
  - application/json
parameters:
  Access-Token:
    name: Authorization
    description: "Bearer + {space} + {accessToken}. Example: Bearer KGNsaWVudF9pZDpjbGllbnRfc2VjcmV0KQ=="
    in: header
    required: true
    type: string
  X-APP-ENV:
    name: x-app-env
    description: "Application Environment"
    in: header
    required: true
    type: string
  Accept-Language:
    name: Accept-Language
    in: header
    description: "language [en_HK, zh_HK, zh_CN]"
    type: string
    enum:
      - en_HK
      - zh_HK
      - zh_CN
  Limit:
    name: $limit
    in: query
    type: integer
    default: 20
  Offset:
    name: $offset
    in: query
    type: integer
    default: 0
  Sort:
    name: $sort
    in: query
    type: string
    default: ""

paths:
  /ping:
    get:
      tags:
        - ping-controller
      operationId: getPing
      responses:
        '200':
          description: OK
          schema:
            type: string