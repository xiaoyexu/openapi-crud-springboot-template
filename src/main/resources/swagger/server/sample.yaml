swagger: "2.0"
info:
  title: OpenAPI definition
  version: v0
host: localhost:6001
basePath: /springboot-dev/hello-service/v1
schemes:
  - http
  - https
#securityDefinitions:
#  Bearer:
#    type: apiKey
#    name: Authorization
#    in: header
#security:
#  - Bearer: [ ]
produces:
  - application/json
consumes:
  - application/json
parameters:
  Access-Token:
    name: Authorization
    description: "Bearer + {space} + {accessToken}. Example: Bearer KGNsaWVudF9pZDpjbGllbnRfc2VjcmV0KQ=="
    in: header
    required: false
    type: string
  X-APP-ENV:
    name: x-app-env
    description: "Application Environment"
    in: header
    required: true
    type: string
  X-Trace-ID:
    name: x-Trace-ID
    in: header
    description: This is a daily unique global ID to represent an user action of a user.
    required: true
    type: string
  Accept-Language:
    name: Accept-Language
    in: header
    description: "language [en_HK, zh_HK, zh_CN]"
    type: string
    enum:
      - en_HK
      - zh_HK
      - zh_CN
  Limit:
    name: limit
    in: query
    type: integer
    default: 20
  Offset:
    name: offset
    in: query
    type: integer
    default: 0
  SortBy:
    name: sortBy
    in: query
    type: string
    default: ""
  Student-Id:
    name: student-id
    required: true
    in: path
    type: string
  Student-Audit-Id:
    name: student-audit-id
    required: true
    in: path
    type: string
  Role-Id:
    name: role-id
    required: true
    in: path
    type: string
  Role-Audit-Id:
    name: role-audit-id
    required: true
    in: path
    type: string
  User-Id:
    name: user-id
    required: true
    in: path
    type: string
  User-Audit-Id:
    name: user-audit-id
    required: true
    in: path
    type: string
paths:
  /ping:
    get:
      tags:
        - ping-controller
      operationId: getPing
      responses:
        '200':
          description: OK
          schema:
            type: string
  /users/login:
    post:
      tags:
        - users
      description: Login
      operationId: login
      parameters:
        - $ref: '#/parameters/X-Trace-ID'
        - in: body
          name: loginRequest
          required: true
          schema:
            $ref: '#/definitions/LoginRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: Unauthorized
